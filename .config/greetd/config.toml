[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = next

# The default session, also known as the greeter.
[default_session]

# `agreety` is the bundled agetty/login-lookalike. You can replace `$SHELL`
# with whatever you want started, such as `sway`.
#

# command = "cage -s -- gtkgreet -c Hyprland -s /etc/greetd/style.css"

 command = "tuigreet -r --asterisks --asterisks-char X --user-menu -t --power-shutdown /usr/sbin/poweroff --power-reboot /usr/sbin/reboot --power-no-setsid --cmd Hyprland --theme 'border=blue;text=green;prompt=green;time=green;action=green;button=white;container=black;input=green'"

# command = "wlgreet"

# The user to run the command as. The privileges this user must have depends
# on the greeter. A graphical greeter may for example require the user to be
# in the `video` group.
user = "greeter"

